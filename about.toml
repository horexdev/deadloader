# cargo-about: the licences of every crate linked into deadloader.exe, for THIRD-PARTY-NOTICES.txt (decision 167).
# Same policy as deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# deadloader's own crates (publish = false) are the GPL-3.0 program itself (LICENSE), not third-party code.
private = { ignore = true }
