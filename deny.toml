[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Only licences compatible with GPL-3.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# The allow-list is a policy, not an inventory: entries may be unused at times.
unused-allowed-license = "allow"
# Mozilla's root certificate list as data; pulled in by ureq's `native-tls` feature and never selected at runtime
# (the Windows trust store is used). Scoped to this crate rather than allowed globally.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; none is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
